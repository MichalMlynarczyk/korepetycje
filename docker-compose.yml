services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-nastomatma.pl, www.nastomatma.pl, http://45.93.139.211}
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - backend_media:/srv/media:ro
      - backend_static:/srv/static:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - public
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-korepetycje}
      POSTGRES_USER: ${POSTGRES_USER:-korepetycje}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korepetycje_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_EXTERNAL_PORT:-55432}:5432"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py sync_oauth_apps &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
      "
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.base}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-docker-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-nastomatma.pl,www.nastomatma.pl,45.93.139.211}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      FRONTEND_URL: ${FRONTEND_URL:-https://nastomatma.pl}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-https://nastomatma.pl}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
      FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-support.nastomatma@gmail.com}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-support.nastomatma@gmail.com}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-support.nastomatma@gmail.com}
      FREE_LESSON_EMAIL: ${FREE_LESSON_EMAIL:-support.nastomatma@gmail.com}
      POSTGRES_DB: ${POSTGRES_DB:-korepetycje}
      POSTGRES_USER: ${POSTGRES_USER:-korepetycje}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korepetycje_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://nastomatma.pl,https://www.nastomatma.pl,http://45.93.139.211,http://45.93.139.211:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://nastomatma.pl,https://www.nastomatma.pl,http://45.93.139.211,http://45.93.139.211:5173}
    expose:
      - "8000"
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    security_opt:
      - no-new-privileges:true
    networks:
      - public
      - internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "5173"
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    security_opt:
      - no-new-privileges:true
    networks:
      - public
    depends_on:
      - backend

networks:
  public:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  backend_media:
  backend_static:
